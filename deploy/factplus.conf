# VirtualHost de Apache para Fact+
# Copiar a /etc/apache2/sites-available/factplus.conf

<VirtualHost *:80>
    ServerName factplus.local
    ServerAdmin admin@factplus.do

    # Laravel solo debe exponer la carpeta public
    DocumentRoot /var/www/factplus/public

    <Directory /var/www/factplus/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/factplus_error.log
    CustomLog ${APACHE_LOG_DIR}/factplus_access.log combined
</VirtualHost>
